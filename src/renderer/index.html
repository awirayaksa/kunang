<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- img-src permits https so that consented remote images can load at all.
       The actual gate is webRequest in the main process, which blocks them
       until the user opts in per document. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' mdfile:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src mdfile: data: https:;">
  <title>kunang</title>
  <link rel="stylesheet" href="./styles/view.css">
</head>
<body>
  <div id="app">
    <div id="view-mode" class="mode active">
      <div id="view-content" class="markdown-body"></div>
    </div>
    <div id="edit-mode" class="mode">
      <div id="edit-panes">
        <div id="source-pane">
          <div id="editor-container"></div>
        </div>
        <div id="preview-pane">
          <div id="preview-content" class="markdown-body"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="consent-bar" hidden>
    <span id="consent-text"></span>
    <button id="consent-allow" type="button">Load images</button>
    <button id="consent-dismiss" type="button">Not now</button>
  </div>
  <div id="find-bar" hidden>
    <input id="find-input" type="text" placeholder="Find" spellcheck="false" autocomplete="off">
    <span id="find-count"></span>
    <button id="find-prev" type="button" title="Previous (Shift+Enter)">&#9650;</button>
    <button id="find-next" type="button" title="Next (Enter)">&#9660;</button>
    <button id="find-close" type="button" title="Close (Esc)">&#10005;</button>
  </div>
  <div id="status-bar">
    <span id="status-text">Ready</span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
