<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' mdfile:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src mdfile: data:;">
  <title>kunang</title>
  <link rel="stylesheet" href="./styles/view.css">
</head>
<body>
  <div id="app">
    <div id="view-mode" class="mode active">
      <div id="view-content" class="markdown-body"></div>
    </div>
    <div id="edit-mode" class="mode">
      <div id="edit-panes">
        <div id="source-pane">
          <div id="editor-container"></div>
        </div>
        <div id="preview-pane">
          <div id="preview-content" class="markdown-body"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="status-bar">
    <span id="status-text">Ready</span>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
