name: Release

# Cut a release with `npm run release`, which pushes a v* tag. That tag is what
# triggers this workflow. workflow_dispatch is here for re-running a build
# against an existing tag without cutting a new version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Must be Windows: the stub is Win32 (named pipes, ReplaceFileW,
    # SHChangeNotify) and the portable build zips via System.IO.Compression.
    runs-on: windows-latest

    permissions:
      contents: write # create the release and upload assets

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0 # full history so release notes can diff against the previous tag

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: stub/go.mod
          cache-dependency-path: stub/go.sum

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-eb-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-eb-

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          # -Raw matters: without it Get-Content streams line by line and
          # ConvertFrom-Json sees each line as a separate document.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # The tag is the release's identity; a mismatch means the tag was
          # created by hand and the built artifact would be misnamed.
          if ($tag -ne "v$version") {
            Write-Error "tag $tag does not match package.json version $version"
            exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run tests
        run: npm test

      - name: Build portable
        run: npm run package:portable

      # Second, because both drive electron-builder and both write
      # dist/win-unpacked. The portable build embeds a zip of that directory,
      # so it has to be the one that made it; the installer only needs it to
      # still be there, and rebuilds it anyway.
      - name: Build installer
        run: npm run package

      - name: Verify artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.v.outputs.version }}"

          # A build that silently produced a stub with no payload, or an
          # installer with no app inside it, would still exist on disk. Assert
          # both are the real thing rather than trusting the exit code.
          $expected = @{
            "dist/kunang-portable-$version.exe" = 50
            "dist/kunang-setup-$version.exe"    = 50
          }

          foreach ($exe in $expected.Keys) {
            if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
            $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
            if ($mb -lt $expected[$exe]) {
              Write-Error "$exe is only ${mb}MB - payload missing?"
              exit 1
            }
            Write-Host "$exe is ${mb}MB"
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.v.outputs.tag }}"
          $version = "${{ steps.v.outputs.version }}"

          # Passed to gh as one variable: PowerShell expands an array into
          # separate arguments for a native command, so both files upload in a
          # single call and a partial release is not possible.
          $assets = @(
            "dist/kunang-portable-$version.exe",
            "dist/kunang-setup-$version.exe"
          )

          # Actions runs pwsh with $ErrorActionPreference = 'Stop'. A non-zero
          # exit from a native command can be promoted to a terminating error,
          # and "no such release" is exactly the exit 1 we need to inspect
          # rather than die on. Read $LASTEXITCODE instead.
          $PSNativeCommandUseErrorActionPreference = $false

          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)

          $PSNativeCommandUseErrorActionPreference = $true

          # Re-runs replace the assets rather than failing on an existing release.
          if ($exists) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title $tag --generate-notes
          }
